<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>substrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e5e2d9;
    --ink:#15140f;
    --thread:rgba(21,20,15,.55);
    --faint:rgba(21,20,15,.16);
    --band:rgba(21,20,15,.20);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:300 12px/1.5 "IBM Plex Mono",ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;gap:34px;
    padding:24px;overflow:hidden;
  }
  #stage{position:relative;line-height:0}
  canvas{display:block;touch-action:none;cursor:crosshair}
  aside{width:262px;flex:0 0 auto}
  table{border-collapse:collapse;width:100%;font-weight:300}
  td{padding:2px 0;white-space:nowrap;vertical-align:middle}
  td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:8px;letter-spacing:-.01em}
  td.i{opacity:.42;padding-right:10px}
  td.p{padding-left:10px;line-height:0}
  .pk{display:inline-block;width:5px;height:5px;margin-right:2px;background:var(--ink);border-radius:50%}
  tr.on td{font-weight:400}
  tr.on td.i{opacity:.85}
  hr{border:0;border-top:1px solid var(--faint);margin:14px 0}
  .meta{opacity:.42;letter-spacing:.01em}
  .hint{opacity:.42;margin-top:12px}
  button{
    font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--ink);
    background:none;border:1px solid var(--thread);border-radius:0;
    padding:6px 14px;cursor:pointer;letter-spacing:.06em;margin-bottom:16px;
  }
  button:hover{background:rgba(21,20,15,.06)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (max-width:820px){
    body{flex-direction:column;gap:18px;padding:14px;overflow:auto;height:auto;min-height:100%}
    aside{width:min(420px,100%)}
  }
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>

<aside>
  <button id="snd" aria-live="polite">son</button>
  <table><tbody id="rows"></tbody></table>
  <hr>
  <div class="meta" id="meta"></div>
  <div class="hint">tirer une patte · frapper la toile</div>
</aside>

<script>
"use strict";

/* ── constantes matérielles ───────────────────────────────────────────── */
const R = 24, M = 5, NL = 8;
// pattes placées aux azimuts tarsaux réels (±30°, ±75°, ±120°, ±160°)
const LEGR = [2,5,8,11,13,16,19,22];
const MU   = 1.1e-6;   // kg/m   masse linéique du rayon (faisceau)
const EA   = 0.15;     // N      raideur axiale effective, bas régime
const T0   = 1.0e-3;   // N      prétension de construction
const ZETA = 0.055;    //        amortissement de la soie — non modifiable
const DMAX = 0.030;    // m      débattement tarsal maximal
const LBASE= 0.150;    // m
const CYC  = 1/(2*Math.PI*ZETA);   // cycles par impulsion — invariant

/* ── géométrie de la toile ────────────────────────────────────────────── */
let seed = 20260808;
const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

const rad = [];
for (let i=0;i<R;i++){
  rad.push({
    ang: i/R*Math.PI*2 + (rnd()-.5)*0.075,
    L:   LBASE*(0.88 + rnd()*0.24),
    leg: -1
  });
}
const legs = [];
for (let j=0;j<NL;j++){
  const i = LEGR[j];
  rad[i].leg = j;
  legs.push({ r:i, pos:0.40+rnd()*0.34, lat:0, px:0, py:0 });
}

const tensionOf = i => {
  const j = rad[i].leg; if (j<0) return T0;
  const L = rad[i].L, x = legs[j].pos*L, d = Math.abs(legs[j].lat);
  if (d < 1e-9) return T0;
  const dL = 0.5*d*d*(1/x + 1/(L-x));
  return Math.min(0.05, T0 + EA*dL/L);
};
const f1Of = i => Math.sqrt(tensionOf(i)/MU) / (2*rad[i].L);

/* ── moteur audio ────────────────────────────────────────────────────────
   Le même noyau sert au worklet (fil audio) et, en repli, au
   ScriptProcessorNode. _P est redéfini à l'identique dans les deux portées. */
const _P = { R:R, M:M, Z:ZETA };

function DSP(fs, post){
  const R=_P.R, M=_P.M, Z=_P.Z, N=R*M;
  const a1=new Float32Array(N), a2=new Float32Array(N);
  const y1=new Float32Array(N), y2=new Float32Array(N);
  const w =new Float32Array(N), gate=new Uint8Array(N);
  const env=new Float32Array(N), pk=new Float32Array(N);
  const dly=new Float32Array(R);
  let ev=[], t=0, prev=0, rep=0, str=null, envDecay=0.9997;

  function push(r,x,a,couple){
    const rr=((r%R)+R)%R, off=Math.round(dly[rr]*(1-x));
    ev.push({t:t+off, r:rr, x:x, a:a});
    if(couple){
      const c=a*0.07;
      ev.push({t:t+off+31, r:(rr+1)%R,   x:x, a:c});
      ev.push({t:t+off+31, r:(rr+R-1)%R, x:x, a:c});
    }
    ev.sort((p,q)=>p.t-q.t);
  }
  function fire(r,x,a){
    for(let n=1;n<=M;n++){
      const i=r*M+n-1;
      if(gate[i]) y1[i] += a*Math.sin(Math.PI*n*x)/n;
    }
  }
  return {
    msg(d){
      if(d.type==='cfg'){
        for(let r=0;r<R;r++){
          dly[r]=d.dly[r];
          for(let n=1;n<=M;n++){
            const i=r*M+n-1, f=d.f1[r]*n;
            pk[i]=d.pick[i];
            if(f>0.42*fs){ gate[i]=0; a1[i]=0; a2[i]=0; w[i]=0; }
            else{
              const om=2*Math.PI*f/fs, pr=Math.exp(-Z*om), th=om*Math.sqrt(1-Z*Z);
              gate[i]=1; w[i]=om;
              a1[i]=2*pr*Math.cos(th); a2[i]=-pr*pr;
            }
          }
        }
      } else if(d.type==='hit'){ push(d.r,d.x,d.a,true); }
      else if(d.type==='slow'){ envDecay=0.99988; }
    },
    render(out){
      const nf=out.length;

      // vent : arrivées de Poisson, jamais périodiques
      if(Math.random() < 8*nf/fs){
        const u=Math.random();
        push((Math.random()*R)|0, 0.25+Math.random()*0.7, 0.0035+0.013*u*u, false);
      }
      // capture : rafale irrégulière, rare
      if(!str && Math.random() < nf/fs/38){
        str={left:(0.6+Math.random()*1.9)*fs, r:(Math.random()*R)|0,
             x:0.55+Math.random()*0.35, next:0};
      }
      if(str){
        str.left-=nf; str.next-=nf;
        while(str.next<=0){
          str.x=Math.min(.95,Math.max(.15, str.x+(Math.random()-.5)*0.09));
          push(str.r+((Math.random()*3)|0)-1, str.x,
               0.010+0.055*Math.random()*Math.random(), true);
          str.next += Math.max(0.004*fs, -Math.log(Math.random())*0.030*fs);
        }
        if(str.left<=0) str=null;
      }

      for(let k=0;k<nf;k++){
        while(ev.length && ev[0].t<=t){ const e=ev.shift(); fire(e.r,e.x,e.a); }
        let s=0;
        for(let i=0;i<N;i++){
          if(!gate[i]) continue;
          const y=a1[i]*y1[i]+a2[i]*y2[i];
          y2[i]=y1[i]; y1[i]=y;
          if(pk[i]) s+=y*pk[i];
          const v=Math.abs(y)*w[i];
          env[i] = v>env[i] ? v : env[i]*envDecay;
        }
        // sensille : détecteur de vitesse de déformation, saturation sans mémoire
        const v=s-prev; prev=s;
        out[k]=Math.tanh(v*6.5)*0.70;
        t++;
      }

      rep+=nf;
      if(rep>=1536){ rep=0; post({env:env.slice()}); }
    }
  };
}

const WORKLET =
  'const _P=' + JSON.stringify(_P) + ';\n' + DSP.toString() + '\n' +
  'class Substrat extends AudioWorkletProcessor{' +
  ' constructor(){super();this.d=DSP(sampleRate,m=>this.port.postMessage(m));' +
  ' this.port.onmessage=e=>this.d.msg(e.data);}' +
  ' process(_,o){this.d.render(o[0][0]);return true;}}' +
  'registerProcessor("substrat",Substrat);';

let ctx=null, send=null, spNode=null, running=false;
const envView = new Float32Array(R*M);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const takeEnv = m => envView.set(m.env);

async function start(){
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  let ok=false;
  if(ctx.audioWorklet){
    try{
      const url=URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'}));
      await ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      const n=new AudioWorkletNode(ctx,'substrat',
        {numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
      n.port.onmessage = e => takeEnv(e.data);
      n.connect(ctx.destination);
      send = m => n.port.postMessage(m);
      ok=true;
    }catch(e){ ok=false; }
  }
  if(!ok){                                   // repli : fil principal
    const d=DSP(ctx.sampleRate, takeEnv);
    spNode = ctx.createScriptProcessor(1024,1,1);
    spNode.onaudioprocess = e => d.render(e.outputBuffer.getChannelData(0));
    spNode.connect(ctx.destination);
    send = m => d.msg(m);
  }
  running = true;
  if(reduce) send({type:'slow'});
  sendCfg();
}

const cfg = { type:'cfg', f1:new Float32Array(R), pick:new Float32Array(R*M), dly:new Float32Array(R) };
function sendCfg(){
  if(!running) return;
  for(let i=0;i<R;i++){
    const T=tensionOf(i), c=Math.sqrt(T/MU);
    cfg.f1[i]=c/(2*rad[i].L);
    cfg.dly[i]=rad[i].L/c*ctx.sampleRate;
    const j=rad[i].leg;
    for(let n=1;n<=M;n++){
      const k=i*M+n-1;
      if(j<0){ cfg.pick[k]=0; continue; }
      const grip = 0.30 + 0.70*Math.min(1,Math.abs(legs[j].lat)/DMAX);
      cfg.pick[k] = grip*Math.sin(Math.PI*n*legs[j].pos);
    }
  }
  send(cfg);
}
function hit(r,x,a){ if(running) send({type:'hit',r:r,x:x,a:a}); }

/* ── rendu ────────────────────────────────────────────────────────────── */
const cv = document.getElementById('c'), g = cv.getContext('2d');
let side=600, hub=300, S=1, dpr=1;
let spiral = [];

function layout(){
  const w=innerWidth, h=innerHeight;
  side = w<820 ? Math.min(w-28, h*0.62, 520) : Math.min(w-350, h-56, 720);
  side = Math.max(260, Math.floor(side));
  dpr = Math.min(2, devicePixelRatio||1);
  cv.width = side*dpr; cv.height = side*dpr;
  cv.style.width = side+'px'; cv.style.height = side+'px';
  g.setTransform(dpr,0,0,dpr,0,0);
  hub = side/2;
  S = (side*0.44)/LBASE;                 // pixels par mètre

  spiral = [];
  const turns = 17, steps = turns*40;
  for(let s=0;s<=steps;s++){
    const u=s/steps, th=u*turns*Math.PI*2, t=0.17+0.80*Math.pow(u,1.04);
    let a=th%(Math.PI*2); if(a<0)a+=Math.PI*2;
    let i=0;
    for(let k=0;k<R;k++){
      let a0=rad[k].ang%(Math.PI*2); if(a0<0)a0+=Math.PI*2;
      let a1=rad[(k+1)%R].ang%(Math.PI*2); if(a1<0)a1+=Math.PI*2;
      if(a1<a0) a1+=Math.PI*2;
      let aa=a; if(aa<a0) aa+=Math.PI*2;
      if(aa>=a0 && aa<a1){ i=k; spiral.push({i,w:(aa-a0)/(a1-a0),t}); break; }
      if(k===R-1) spiral.push({i:R-1,w:0,t});
    }
  }
}

function pointAt(i,t){                     // position statique le long du rayon i
  const r=rad[i], Lp=r.L*S, ux=Math.cos(r.ang), uy=Math.sin(r.ang);
  const j=r.leg;
  if(j<0 || legs[j].lat===0) return [hub+ux*Lp*t, hub+uy*Lp*t];
  const p=legs[j].pos, dpx=legs[j].lat*S, nx=-uy, ny=ux;
  let ax, off;
  if(t<=p){ const k=t/p; ax=Lp*t; off=dpx*k; }
  else { const k=(t-p)/(1-p); ax=Lp*t; off=dpx*(1-k); }
  return [hub+ux*ax+nx*off, hub+uy*ax+ny*off];
}

function bandAt(i,t){                      // demi-largeur d'enveloppe (px)
  let e=0;
  for(let n=1;n<=M;n++) e += envView[i*M+n-1]*Math.abs(Math.sin(Math.PI*n*t));
  return 9.5*(1-Math.exp(-e*55));
}

function draw(){
  g.clearRect(0,0,side,side);

  // spirale de capture — mauvaise conductrice, elle reste immobile
  g.strokeStyle='rgba(21,20,15,.15)'; g.lineWidth=0.7;
  g.beginPath();
  for(let s=0;s<spiral.length;s++){
    const p=spiral[s], a=pointAt(p.i,p.t), b=pointAt((p.i+1)%R,p.t);
    const x=a[0]+(b[0]-a[0])*p.w, y=a[1]+(b[1]-a[1])*p.w;
    s?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.stroke();

  // cadre
  g.strokeStyle='rgba(21,20,15,.22)'; g.lineWidth=1;
  g.beginPath();
  for(let i=0;i<=R;i++){ const p=pointAt(i%R,1); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }
  g.stroke();

  const NS=44;
  for(let i=0;i<R;i++){
    const ux=Math.cos(rad[i].ang), uy=Math.sin(rad[i].ang), nx=-uy, ny=ux;
    // bande d'enveloppe : ce qu'un œil intègre d'un fil qui vibre
    g.fillStyle='rgba(21,20,15,.20)';
    g.beginPath();
    for(let s=0;s<=NS;s++){ const t=s/NS,p=pointAt(i,t),w=bandAt(i,t);
      s?g.lineTo(p[0]+nx*w,p[1]+ny*w):g.moveTo(p[0]+nx*w,p[1]+ny*w); }
    for(let s=NS;s>=0;s--){ const t=s/NS,p=pointAt(i,t),w=bandAt(i,t);
      g.lineTo(p[0]-nx*w,p[1]-ny*w); }
    g.closePath(); g.fill();
    // rayon
    g.strokeStyle='rgba(21,20,15,.55)'; g.lineWidth=0.9;
    g.beginPath();
    for(let s=0;s<=NS;s++){ const p=pointAt(i,s/NS); s?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }
    g.stroke();
  }

  // tarses
  for(let j=0;j<NL;j++){
    const L=legs[j], p=pointAt(L.r,L.pos); L.px=p[0]; L.py=p[1];
    g.strokeStyle='rgba(21,20,15,.80)'; g.lineWidth = j===drag ? 1.9 : 1.15;
    g.beginPath(); g.moveTo(hub,hub); g.lineTo(p[0],p[1]); g.stroke();
    g.fillStyle='#15140f';
    g.beginPath(); g.arc(p[0],p[1], j===drag?4.6:3.2, 0, 6.2832); g.fill();
  }
  g.fillStyle='rgba(21,20,15,.9)';
  g.beginPath(); g.arc(hub,hub,2.4,0,6.2832); g.fill();
}

/* ── panneau ──────────────────────────────────────────────────────────── */
const rowsEl=document.getElementById('rows');
const rowEls=[];
for(let j=0;j<NL;j++){
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="i">'+(j+1)+'</td><td class="n"></td><td class="n"></td><td class="p"></td>';
  rowsEl.appendChild(tr);
  rowEls.push({tr, f:tr.children[1], t:tr.children[2], p:tr.children[3]});
}
document.getElementById('meta').textContent =
  'ζ '+ZETA.toFixed(3)+' · '+CYC.toFixed(1).replace('.',',')+' cycles · 1 canal';

let lastPanel=0;
function panel(now){
  if(now-lastPanel<130) return; lastPanel=now;
  for(let j=0;j<NL;j++){
    const i=legs[j].r, e=rowEls[j];
    e.f.textContent = Math.round(f1Of(i))+' Hz';
    e.t.textContent = (tensionOf(i)*1e3).toFixed(1)+' mN';
    e.tr.className = j===drag ? 'on' : '';
    let h='';
    for(let n=1;n<=M;n++){
      const a=Math.abs(Math.sin(Math.PI*n*legs[j].pos));
      h+='<i class="pk" style="opacity:'+(0.10+0.90*a).toFixed(2)+
         ';transform:scale('+(0.34+0.66*a).toFixed(2)+')"></i>';
    }
    e.p.innerHTML=h;
  }
}

/* ── geste : la patte qui écoute est la patte qui tend ────────────────── */
let drag=-1, moved=0, downPt=null, prevContact=null;

function local(ev){
  const r=cv.getBoundingClientRect();
  return [ev.clientX-r.left, ev.clientY-r.top];
}
cv.addEventListener('pointerdown', ev=>{
  cv.setPointerCapture(ev.pointerId);
  const [x,y]=local(ev); downPt=[x,y]; moved=0; drag=-1;
  let best=1e9;
  for(let j=0;j<NL;j++){
    const d=Math.hypot(x-legs[j].px,y-legs[j].py);
    if(d<best){best=d;drag=j;}
  }
  if(best>34) drag=-1;
  if(drag>=0){ const L=legs[drag]; prevContact=[L.px,L.py]; }
});
cv.addEventListener('pointermove', ev=>{
  if(drag<0) return;
  const [x,y]=local(ev);
  moved=Math.max(moved,Math.hypot(x-downPt[0],y-downPt[1]));
  const L=legs[drag], r=rad[L.r];
  const ux=Math.cos(r.ang), uy=Math.sin(r.ang), nx=-uy, ny=ux;
  const dx=x-hub, dy=y-hub;
  const along=(dx*ux+dy*uy)/S, lat=(dx*nx+dy*ny)/S;
  L.pos=Math.min(0.92,Math.max(0.12, along/r.L));
  L.lat=Math.max(-DMAX,Math.min(DMAX, lat));
  sendCfg();
  // l'impulsion suit la vitesse : un geste lent ne produit rien
  const p=pointAt(L.r,L.pos), dm=Math.hypot(p[0]-prevContact[0],p[1]-prevContact[1])/S;
  prevContact=p;
  const a=Math.min(0.24,Math.max(0,(dm-0.00035)*11));
  if(a>0) hit(L.r, L.pos, a);
});
function release(){ drag=-1; }
cv.addEventListener('pointerup', ev=>{
  if(drag<0 || moved<4){
    const [x,y]=local(ev), dx=x-hub, dy=y-hub;
    const rr=Math.hypot(dx,dy);
    if(rr>10){
      let th=Math.atan2(dy,dx), bi=0, bd=9;
      for(let i=0;i<R;i++){
        let d=Math.abs(((rad[i].ang-th+Math.PI*3)%(Math.PI*2))-Math.PI);
        if(d<bd){bd=d;bi=i;}
      }
      const t=Math.min(0.95,Math.max(0.06, rr/(rad[bi].L*S)));
      hit(bi,t,0.085);
    }
  }
  release();
});
cv.addEventListener('pointercancel', release);

/* ── boucle ───────────────────────────────────────────────────────────── */
const btn=document.getElementById('snd');
btn.addEventListener('click', async ()=>{
  if(!running){
    try{ await start(); btn.textContent='silence'; }
    catch(e){ btn.textContent='son indisponible'; btn.disabled=true; }
  } else if(ctx.state==='running'){ await ctx.suspend(); btn.textContent='son'; }
  else { await ctx.resume(); btn.textContent='silence'; }
});

addEventListener('resize', layout);
layout();
(function loop(now){ draw(); panel(now||0); requestAnimationFrame(loop); })();
</script>
</body>
</html>
